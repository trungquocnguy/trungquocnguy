<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-label="Stack">
  <rect width="1200" height="268" rx="24" fill="#0B1220" stroke="#2A3B5E"/>
  <text x="32" y="42" fill="#6D7B94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">STACK I ACTUALLY SHIP WITH</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600">
    <!-- row 1 -->
    <text x="32" y="84" fill="#8B97AB" font-size="12" font-weight="500">Language</text>
    <rect x="140" y="62" width="56" height="32" rx="16" fill="#F0B429" fill-opacity="0.14" stroke="#F0B429" stroke-opacity="0.55"/>
    <text x="156" y="83" fill="#F0B429">C#</text>
    <rect x="206" y="62" width="64" height="32" rx="16" fill="#2EC4B6" fill-opacity="0.14" stroke="#2EC4B6" stroke-opacity="0.55"/>
    <text x="220" y="83" fill="#2EC4B6">SQL</text>
    <rect x="280" y="62" width="148" height="32" rx="16" fill="#8B7CFF" fill-opacity="0.14" stroke="#8B7CFF" stroke-opacity="0.55"/>
    <text x="296" y="83" fill="#C9C2FF">ASP.NET Core</text>
    <rect x="438" y="62" width="92" height="32" rx="16" fill="#FF6B6B" fill-opacity="0.14" stroke="#FF6B6B" stroke-opacity="0.55"/>
    <text x="454" y="83" fill="#FF9B9B">EF Core</text>

    <!-- row 2 -->
    <text x="32" y="136" fill="#8B97AB" font-size="12" font-weight="500">Data</text>
    <rect x="140" y="114" width="118" height="32" rx="16" fill="#2EC4B6" fill-opacity="0.14" stroke="#2EC4B6" stroke-opacity="0.55"/>
    <text x="156" y="135" fill="#2EC4B6">PostgreSQL</text>
    <rect x="268" y="114" width="72" height="32" rx="16" fill="#FF6B6B" fill-opacity="0.14" stroke="#FF6B6B" stroke-opacity="0.55"/>
    <text x="284" y="135" fill="#FF9B9B">Redis</text>
    <rect x="350" y="114" width="108" height="32" rx="16" fill="#F0B429" fill-opacity="0.14" stroke="#F0B429" stroke-opacity="0.55"/>
    <text x="366" y="135" fill="#F0B429">RabbitMQ</text>
    <rect x="468" y="114" width="124" height="32" rx="16" fill="#8B7CFF" fill-opacity="0.14" stroke="#8B7CFF" stroke-opacity="0.55"/>
    <text x="484" y="135" fill="#C9C2FF">MassTransit</text>

    <!-- row 3 -->
    <text x="32" y="188" fill="#8B97AB" font-size="12" font-weight="500">Correctness</text>
    <rect x="140" y="166" width="86" height="32" rx="16" fill="#F0B429" fill-opacity="0.14" stroke="#F0B429" stroke-opacity="0.55"/>
    <text x="156" y="187" fill="#F0B429">Outbox</text>
    <rect x="236" y="166" width="68" height="32" rx="16" fill="#8B7CFF" fill-opacity="0.14" stroke="#8B7CFF" stroke-opacity="0.55"/>
    <text x="252" y="187" fill="#C9C2FF">SAGA</text>
    <rect x="314" y="166" width="124" height="32" rx="16" fill="#2EC4B6" fill-opacity="0.14" stroke="#2EC4B6" stroke-opacity="0.55"/>
    <text x="330" y="187" fill="#2EC4B6">Idempotency</text>
    <rect x="448" y="166" width="168" height="32" rx="16" fill="#FF6B6B" fill-opacity="0.14" stroke="#FF6B6B" stroke-opacity="0.55"/>
    <text x="464" y="187" fill="#FF9B9B">Pessimistic locks</text>

    <!-- row 4 -->
    <text x="32" y="240" fill="#8B97AB" font-size="12" font-weight="500">Prove it</text>
    <rect x="140" y="218" width="64" height="32" rx="16" fill="#8B7CFF" fill-opacity="0.14" stroke="#8B7CFF" stroke-opacity="0.55"/>
    <text x="156" y="239" fill="#C9C2FF">xUnit</text>
    <rect x="214" y="218" width="132" height="32" rx="16" fill="#2EC4B6" fill-opacity="0.14" stroke="#2EC4B6" stroke-opacity="0.55"/>
    <text x="230" y="239" fill="#2EC4B6">Testcontainers</text>
    <rect x="356" y="218" width="142" height="32" rx="16" fill="#F0B429" fill-opacity="0.14" stroke="#F0B429" stroke-opacity="0.55"/>
    <text x="372" y="239" fill="#F0B429">OpenTelemetry</text>
    <rect x="508" y="218" width="86" height="32" rx="16" fill="#FF6B6B" fill-opacity="0.14" stroke="#FF6B6B" stroke-opacity="0.55"/>
    <text x="524" y="239" fill="#FF9B9B">Docker</text>
  </g>

  <text x="760" y="130" fill="#F4F7FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Not a tool list.</text>
  <text x="760" y="160" fill="#B7C2D4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">These showed up because a bank retried,</text>
  <text x="760" y="182" fill="#B7C2D4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">an invoice timed out, or two workers</text>
  <text x="760" y="204" fill="#B7C2D4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">grabbed the same row.</text>
</svg>
