<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Selected work">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10192C"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <!-- FlashSale -->
  <g transform="translate(0,0)">
    <rect width="584" height="320" rx="24" fill="url(#card)" stroke="#2A3B5E"/>
    <rect width="584" height="6" rx="3" fill="#F0B429"/>
    <text x="28" y="44" fill="#6D7B94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">PERSONAL · .NET 8</text>
    <text x="28" y="82" fill="#F4F7FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">FlashSale</text>
    <text x="28" y="112" fill="#B7C2D4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Distributed flash-sale. Stock cannot go negative.</text>

    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
      <rect x="28" y="140" width="160" height="58" rx="12" fill="#171F33"/>
      <text x="42" y="164" fill="#8B97AB" font-size="11">REQUESTS</text>
      <text x="42" y="186" fill="#F0B429" font-size="18" font-weight="700">377K</text>

      <rect x="200" y="140" width="160" height="58" rx="12" fill="#171F33"/>
      <text x="214" y="164" fill="#8B97AB" font-size="11">ORDERS / STOCK</text>
      <text x="214" y="186" fill="#2EC4B6" font-size="18" font-weight="700">5,000 / 5,000</text>

      <rect x="372" y="140" width="184" height="58" rx="12" fill="#171F33"/>
      <text x="386" y="164" fill="#8B97AB" font-size="11">OVERSELL</text>
      <text x="386" y="186" fill="#8B7CFF" font-size="18" font-weight="700">zero</text>
    </g>

    <text x="28" y="232" fill="#8B97AB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Redis Lua shards · SAGA returns stock to the right shard</text>
    <text x="28" y="254" fill="#8B97AB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">174 tests on real Postgres / Redis / RabbitMQ</text>
    <text x="28" y="288" fill="#5C6B86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">k6 · NGINX · 3 API + 2 workers · OpenTelemetry</text>
  </g>

  <!-- Payments -->
  <g transform="translate(616,0)">
    <rect width="584" height="320" rx="24" fill="url(#card)" stroke="#2A3B5E"/>
    <rect width="584" height="6" rx="3" fill="#2EC4B6"/>
    <text x="28" y="44" fill="#6D7B94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">PRODUCTION · .NET</text>
    <text x="28" y="82" fill="#F4F7FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">Payments &amp; e-invoice</text>
    <text x="28" y="112" fill="#B7C2D4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Bank webhooks and invoices that must not double-issue.</text>

    <g font-family="ui-sans-serif, system-ui, sans-serif">
      <rect x="28" y="140" width="528" height="40" rx="10" fill="#171F33"/>
      <circle cx="48" cy="160" r="5" fill="#F0B429"/>
      <text x="64" y="165" fill="#E8EDF5" font-size="14">ABBank · 7 endpoints · Basic + RSA on raw bytes</text>

      <rect x="28" y="190" width="528" height="40" rx="10" fill="#171F33"/>
      <circle cx="48" cy="210" r="5" fill="#2EC4B6"/>
      <text x="64" y="215" fill="#E8EDF5" font-size="14">E-invoice idempotency · 3 layers · partial-batch retry</text>

      <rect x="28" y="240" width="528" height="40" rx="10" fill="#171F33"/>
      <circle cx="48" cy="260" r="5" fill="#8B7CFF"/>
      <text x="64" y="265" fill="#E8EDF5" font-size="14">Transactional outbox · claim lock · dead-worker reaper</text>
    </g>
  </g>
</svg>
